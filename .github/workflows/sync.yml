name: Apply

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  # 社人研の地域別推計は5年ごとに出る。定期実行はせず、新しい推計を足すときに手で回す
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う。
    # contents と pull-requests は、Queria で変更された説明をこのリポジトリに戻す PR に使う
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@1e4fb6e5ce0612781bcd51f0575048c49cd591ec
    with:
      dataset_name: ipss
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

name: Probe
on: push
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          curl -sSfL -o /tmp/kekka.xlsx https://www.ipss.go.jp/pp-shicyoson/j/shicyoson23/3kekka/suikei_kekka.xlsx
          pip install openpyxl >/dev/null
          python - <<'PY'
          import openpyxl, csv
          b = openpyxl.load_workbook("/tmp/kekka.xlsx", read_only=True)
          with open("probe.csv", "w", newline="") as f:
              w = csv.writer(f)
              for r in b.worksheets[0].iter_rows(values_only=True):
                  w.writerow(r)
          PY
          git config user.name probe && git config user.email probe@example.com
          git add probe.csv && git commit -m "probe data [skip ci]" && git push

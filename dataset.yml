# この dataset.yml は fdl commit が読む（FDL の dataset.json を YAML で書いたもの）。
# 表の説明は models/ の *.table.yml に書く。表と列の型・NULL・行数は fdl commit がカタログから埋める。
# Queria だけの項目（テーマ・カバー・列の意味）は annotations.queria に書く。
name: ipss
title: 国立社会保障・人口問題研究所 将来推計人口
description: |-
  国立社会保障・人口問題研究所（社人研）の「日本の地域別将来推計人口（令和5年推計）」です。都道府県・市区町村ごとの男女・5 歳階級別人口を、2020 年から 2050 年まで 5 年ごとに収録しています。

  出典：国立社会保障・人口問題研究所「日本の地域別将来推計人口（令和5(2023)年推計）」。Queria が加工したものです。
keywords:
  - 将来推計人口
  - 人口推計
  - 市区町村
  - 年齢
  - 男女
  - 5歳階級
  - 人口減少
  - 高齢化
  - 社人研
  - 国立社会保障・人口問題研究所
homepage: https://github.com/queria-io/dataset-ipss
language: ja

licenses:
  - JP-PDL-1.0

sources:
  - title: 国立社会保障・人口問題研究所 日本の地域別将来推計人口（令和5(2023)年推計）
    path: https://www.ipss.go.jp/pp-shicyoson/j/shicyoson23/t-page.asp
  - title: 国立社会保障・人口問題研究所 サイトご利用にあたって
    path: https://www.ipss.go.jp/site-ad/link/anlink.html

contributors:
  - title: 国立社会保障・人口問題研究所
    path: https://www.ipss.go.jp/
    roles: [rightsHolder]

spatial_coverage: [JP]
update_frequency: irregular

schemas:
  - name: regional_projection
    title: 地域別将来推計人口

annotations:
  queria:
    themes: [population]
    cover: 📉
...
